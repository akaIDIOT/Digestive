name: Test package

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: '3.14'
          cache: true
          cache-dependency-path: 'pdm.lock'
      - run: pdm install --group check
      - run: pdm run check
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', 'pypy-3.10', 'pypy-3.11']
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: ${{ matrix.python-version }}
          allow-python-prereleases: true
          cache: true
          cache-dependency-path: 'pdm.lock'
      - run: pdm install --group test
      - run: pdm run test
      - run: |
          pdm run python -m digestive.main --hashes --recursive --output /tmp/digestive-test-output.yml tests/files
          grep random.dd /tmp/digestive-test-output.yml
          grep 810ec5f2086379f0e8000456dbf2aede8538fbc9d9898835f114c8771ed834b5 /tmp/digestive-test-output.yml
